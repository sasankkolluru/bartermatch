services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    volumes: ["./backend:/app", "./frontend:/frontend:ro"]
  web:
    image: node:20-alpine
    working_dir: /web
    volumes: ["./frontend:/web"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [api]
